<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1000" role="img" aria-labelledby="title desc">
  <title id="title">Stoke connects your models to your work</title>
  <desc id="desc">A simplified three-part physical model: private models, a Stoke routing core, and a destination plate for your work.</desc>
  <defs><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1ede6"/></linearGradient><filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur stdDeviation="12"/></filter><style>.ink{fill:#191919}.label{font-family:Sora,Arial,sans-serif;font-weight:700;letter-spacing:2px}.body{font-family:'Source Sans 3',Arial,sans-serif}</style></defs>
  <rect width="780" height="1000" fill="#fcfcfc"/><ellipse cx="390" cy="480" rx="360" ry="460" fill="url(#paper)"/>
  <g opacity=".45"><circle cx="55" cy="76" r="7" fill="#f15332"/><path d="M80 76H214M80 91H164" stroke="#cfc7bc" stroke-width="3" stroke-linecap="round"/></g>
  <path d="M374 430C390 465 390 500 390 542" fill="none" stroke="#bdb7ae" stroke-width="9" stroke-linecap="round"/><path d="M374 430C390 465 390 500 390 542" fill="none" stroke="#f15332" stroke-width="5" stroke-linecap="round"/>
  <path d="M450 628C475 662 500 692 520 720" fill="none" stroke="#bdb7ae" stroke-width="9" stroke-linecap="round"/><path d="M450 628C475 662 500 692 520 720" fill="none" stroke="#f15332" stroke-width="5" stroke-linecap="round"/>
  <!-- model group -->
  <g transform="translate(145 210)"><ellipse cx="245" cy="148" rx="235" ry="50" fill="#191919" opacity=".13" filter="url(#shadow)"/><path d="M0 78L210 42L410 80L198 120Z" fill="#d9d4cb" stroke="#191919" stroke-width="4"/><path d="M0 78L198 120V178L0 134Z" fill="#b2ada5" stroke="#191919" stroke-width="4"/><path d="M198 120L410 80V138L198 178Z" fill="#928d86" stroke="#191919" stroke-width="4"/><path d="M24 79L209 49L378 81L196 112Z" fill="#ef5d3e"/><ellipse cx="198" cy="80" rx="35" ry="12" fill="#fff" stroke="#191919" stroke-width="4"/><circle cx="198" cy="80" r="10" fill="#ef5d3e"/><path d="M243 79L324 66M260 94L354 78" stroke="#191919" stroke-width="4" stroke-linecap="round" opacity=".6"/><text x="38" y="150" class="label ink" font-size="20">YOUR MODELS</text></g>
  <!-- Stoke core -->
  <g><ellipse cx="390" cy="626" rx="155" ry="44" fill="#191919" opacity=".19" filter="url(#shadow)"/><path d="M276 560L374 509L514 530L544 596L441 647L301 624Z" fill="#6e6860" stroke="#191919" stroke-width="5"/><path d="M276 544L374 493L514 514L544 580L441 631L301 608Z" fill="#252525" stroke="#191919" stroke-width="5"/><path d="M296 541L378 499L493 517L518 574L436 615L318 597Z" fill="#f15332" stroke="#fff" stroke-width="2"/><path d="M326 576L382 546L459 557L474 582L431 603L348 591Z" fill="#191919" opacity=".84"/><path d="M343 576L385 554L440 561L448 577L426 589L356 583Z" fill="#fff" opacity=".95"/><text x="372" y="580" class="label ink" font-size="15">STOKE</text><circle cx="486" cy="544" r="9" fill="#fff" stroke="#191919" stroke-width="3"/><circle cx="486" cy="544" r="4" fill="#f15332"/></g>
  <!-- destination -->
  <g transform="translate(210 708)"><ellipse cx="210" cy="140" rx="240" ry="45" fill="#191919" opacity=".13" filter="url(#shadow)"/><path d="M0 60L220 24L410 64L188 103Z" fill="#fff" stroke="#191919" stroke-width="4"/><path d="M0 60L188 103V166L0 120Z" fill="#d7d1c8" stroke="#191919" stroke-width="4"/><path d="M188 103L410 64V128L188 166Z" fill="#aaa39a" stroke="#191919" stroke-width="4"/><path d="M24 61L219 31L378 65L187 94Z" fill="#f2eee8"/><circle cx="185" cy="75" r="28" fill="#f15332" stroke="#191919" stroke-width="4"/><circle cx="177" cy="72" r="3" fill="#191919"/><circle cx="193" cy="72" r="3" fill="#191919"/><path d="M177 82Q185 89 193 82" fill="none" stroke="#191919" stroke-width="3" stroke-linecap="round"/><text x="235" y="86" class="label ink" font-size="22">YOUR WORK</text></g>
  <circle cx="392" cy="466" r="17" fill="#fff" stroke="#f15332" stroke-width="4"/><circle cx="392" cy="466" r="7" fill="#f15332"/>
</svg>
