<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Stoke routes private models into the tools where work happens</title>
  <desc id="desc">Three dimensional model plates connect to a substantial vermilion Stoke routing core, then branch to App, Agent and Editor destination plates.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1ede6"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
    <style>
      .ink{fill:#191919}.label{font-family:Sora,Arial,sans-serif;font-weight:700;letter-spacing:2px}.body{font-family:'Source Sans 3',Arial,sans-serif}
    </style>
  </defs>
