<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="720" viewBox="0 0 480 300" fill="none"><g font-family="Sora,Arial,sans-serif" font-size="20" fill="#191A18"><title>An error log with the credential removed</title><desc>The same timeout error remains after Stoke replaces a dummy API key with an API_KEY redaction marker.</desc>
<rect x="16" y="10" width="448" height="113" rx="12" fill="#FFF" stroke="#E3DED8" stroke-width="1.5"/>
<text x="37" y="41" font-size="20" font-weight="600">Original log</text>
<text x="37" y="74" font-family="monospace" font-size="20">ERROR upstream timeout</text>
<rect x="30" y="82" width="360" height="31" rx="4" fill="#FCE9E2"/>
<text x="37" y="104" font-family="monospace" font-size="20" fill="#B63019">key=sk-00000000000000000000</text>
<path fill="none" d="M240 124v50m-6-6 6 7 6-7" stroke="#F15332" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="173" y="131" width="134" height="35" rx="17" fill="#FCFCFC"/>
<g transform="translate(182 133) scale(1)" fill="#F15332"><path d="M4 24 L12 22.5 L20 23 L28 22.4 L29 27 L20 28 L11 27.4 L3 28 Z"/><path d="M6 20 L11 12 L15 5 L19 4 L20 8 L14 16 L10 22 Z"/><path d="M20 11 L24 12 L28 19 L26 22 L22 19 L18 14 Z"/></g>
<text x="222" y="156" font-size="20" font-weight="600">Stoke</text>
<rect x="16" y="180" width="448" height="113" rx="12" fill="#FFF" stroke="#E3DED8" stroke-width="1.5"/>
<text x="37" y="211" font-size="20" font-weight="600">Sent to model</text>
<text x="37" y="244" font-family="monospace" font-size="20">ERROR upstream timeout</text>
<rect x="30" y="252" width="344" height="31" rx="4" fill="#F7E6DF"/>
<text x="37" y="274" font-family="monospace" font-size="20">key=API_KEY:[REDACTED]</text>
</g></svg>