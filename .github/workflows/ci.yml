name: ci

# PRs, manual runs, and the release caller: one complete verification per main push.
# The smokes need no Ollama — they run against stdlib mock nodes.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      native:
        description: Whether native checks and release archives are required
        value: ${{ jobs.changes.outputs.native }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: CI selection and workflow contracts
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select native work against PR merge-base or published nightly
        id: filter
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # Select work before executing PR code, using only the reviewed base.
            [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            selector="$RUNNER_TEMP/stoke-ci-changes.py"
            if ! git show "$PR_BASE_SHA:scripts/ci_changes.py" > "$selector"; then
              # Bootstrapping this gate must run every native check.
              echo 'native=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            python3 -I "$selector"
          else
            python3 -I scripts/ci_changes.py
          fi
      - name: Check CI selection and promotion contracts
        run: python3 -m unittest scripts.test_ci_workflows scripts.test_ci_changes -v

  website:
    name: website and installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Landing build, links, sitemap, and installer syntax
        run: |
          python3 scripts/build_guides.py
          python3 scripts/check_landing.py
          sh -n landing/install.sh

  test:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    name: build + test + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        run: cargo build --locked

      - name: Unit tests
        run: cargo test --locked

      - name: Smoke — placement, streaming, failover, health
        run: ./scripts/smoke.sh

      - name: Smoke — federation, hop guard, cycle safety
        run: ./scripts/smoke_federation.sh

      # Guards the claim on the homepage. Each assertion is a bug that shipped once.
      - name: Smoke — spend firewall (pricing gate, streamed spend, fan-out clamp, cache isolation)
        run: ./scripts/smoke_spend.sh

      - name: Smoke — OpenAI Responses passthrough
        run: ./scripts/smoke_responses.sh

      - name: Smoke — Claude Code and Codex launchers
        run: ./scripts/smoke_client_run.sh

      - name: Smoke — cache policy and A1 identity
        run: STOKE_BIN=target/debug/stoke python3 scripts/smoke_cache_identity.py

      - name: Smoke — gateway auth and Headroom protocol boundaries
        run: |
          python3 scripts/smoke_gateway_auth.py target/debug/stoke
          python3 scripts/smoke_headroom.py

      - name: Smoke — bounded cold-request coalescing
        run: STOKE_BIN=target/debug/stoke python3 scripts/smoke_coalescing.py

      - name: Smoke — subscription fallback + alias bridge (deterministic mocks)
        run: ./scripts/smoke_subscription_fallback.sh

      - name: Smoke — durable budget ledger (spend survives crash/restart, raw key never in DB)
        run: ./scripts/smoke_durable_ledger.sh

      - name: Security — negative wire regressions
        run: |
          STOKE_BIN="$PWD/target/debug/stoke" python3 tests/security_integration.py
          STOKE_BIN="$PWD/target/debug/stoke" python3 tests/security_routing_integration.py
          STOKE_BIN="$PWD/target/debug/stoke" python3 tests/security_webhook_integration.py

  headroom:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    name: optional Headroom — macOS arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install pinned optional worker
        run: python -m pip install --require-hashes --no-deps -r integrations/headroom/requirements-optional.txt
      - name: Worker and launcher tests
        run: python -m unittest discover -s integrations/headroom -p "test_*.py" -v
      - name: Build release binary
        run: cargo build --release --locked --bin stoke --bin stoke-cli
      - name: Release pins and real worker integration
        run: |
          python scripts/smoke_gateway_auth.py target/release/stoke --verify-release-pins
          python scripts/smoke_headroom_package.py --binary target/release/stoke --worker-python "$(command -v python)"

  js-plugins:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    name: JS plugin chains (V8 feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Feature-gated JS plugin tests
        run: cargo test --locked --features js-plugins

      - name: Security — native JavaScript wire enforcement
        run: |
          cargo build --locked --features js-plugins
          STOKE_TEST_JS=1 STOKE_BIN="$PWD/target/debug/stoke" python3 tests/security_integration.py
          STOKE_TEST_JS=1 STOKE_BIN="$PWD/target/debug/stoke" python3 tests/security_response_integration.py
          STOKE_BIN="$PWD/target/debug/stoke" python3 tests/security_routing_integration.py
          STOKE_BIN="$PWD/target/debug/stoke" python3 tests/security_webhook_integration.py
