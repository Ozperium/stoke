name: release

# Two channels:
#   - workflow_dispatch promotion -> a real GitHub Release (this is what
#                     `latest` resolves to, and therefore what the one-line
#                     installer downloads)
#   - push to main -> a rolling `nightly` prerelease, rebuilt every commit.
#                     Prereleases are excluded from `latest`, so nightly never
#                     hijacks the stable install path. Get it with:
#                       curl -sSf https://stokegate.com/install | sh -s -- --version nightly
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,  target: aarch64-apple-darwin,       name: stoke-macos-arm64 }
          - { os: macos-latest,  target: x86_64-apple-darwin,        name: stoke-macos-x64 }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl,  name: stoke-linux-x64 }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, name: stoke-linux-arm64 }
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # musl static builds need the cross linker; rustls means no OpenSSL to cross-compile.
      - name: Install musl tools
        if: contains(matrix.target, 'linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            # glibc's cross gcc compiles bundled SQLite against glibc headers,
            # emitting open64/__memcpy_chk refs musl cannot resolve. musl.cc is
            # unreachable from Actions runners, so use cross-rs: its image ships
            # a real aarch64 musl cross-toolchain.
            cargo install cross --locked
            echo "CROSS_BUILD=1" >> "$GITHUB_ENV"
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: |
          if [ "$CROSS_BUILD" = "1" ]; then
            cross build --release --locked --target ${{ matrix.target }} --bin stoke --bin stoke-cli
          else
            cargo build --release --locked --target ${{ matrix.target }} --bin stoke --bin stoke-cli
          fi

      - name: Package
        run: |
          dir="${{ matrix.name }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/stoke" "target/${{ matrix.target }}/release/stoke-cli" "$dir/"
          cp README.md LICENSE stoke.example.toml "$dir/"
          if [ "${{ matrix.name }}" = "stoke-macos-arm64" ]; then
            mkdir -p "$dir/integrations"
            cp -R integrations/headroom "$dir/integrations/"
          fi
          tar czf "${{ matrix.name }}.tar.gz" "$dir"
          shasum -a 256 "${{ matrix.name }}.tar.gz" > "${{ matrix.name }}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.tar.gz
            ${{ matrix.name }}.tar.gz.sha256


  # Every commit on main refreshes a rolling `nightly` prerelease. The old tag
  # is deleted first so the tag actually moves to the new commit.
  nightly:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Record nightly source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - "$SOURCE_SHA" <<'PY'
          import json
          from pathlib import Path

          dist = Path("dist")
          (dist / "release-manifest.json").write_text(json.dumps({
              "schema": 1,
              "commit": __import__("sys").argv[1],
              "assets": sorted(path.name for path in dist.glob("stoke-*")),
          }, indent=2) + "\n")
          PY
      - name: Reset the rolling nightly tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete nightly --cleanup-tag --yes || true
      - name: Publish nightly prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "nightly (${{ github.sha }})"
          body: |
            Rolling build of `main` — unstable, rebuilt on every commit.
            Install: `curl -sSf https://stokegate.com/install | sh -s -- --version nightly`
          prerelease: true
          files: dist/*
